<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON整形ツール</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", sans-serif; max-width: 960px; margin: 32px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.5rem; }
  .desc { color: #555; font-size: 0.9rem; margin-bottom: 20px; }
  textarea { width: 100%; height: 240px; font-family: monospace; font-size: 0.9rem; padding: 8px; box-sizing: border-box; }
  .controls { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  button { padding: 10px 20px; font-size: 0.95rem; cursor: pointer; border: none; border-radius: 6px; background: #2b6cb0; color: white; }
  button.secondary { background: #718096; }
  button:hover { opacity: 0.9; }
  #error { color: #c53030; margin-top: 8px; font-size: 0.9rem; }
  .privacy { margin-top: 12px; font-size: 0.8rem; color: #888; }
  .support { display: inline-block; margin-top: 12px; padding: 8px 16px; border: 1px solid #ddd; border-radius: 6px; color: #555; text-decoration: none; font-size: 0.85rem; }
  .support:hover { background: #f7f7f7; }
</style>
</head>
<body>
  <h1>JSON整形ツール</h1>
  <p class="desc">JSONテキストを整形(インデント付与)または圧縮します。すべてブラウザ内で処理され、外部にデータは送信されません。</p>

  <textarea id="input" placeholder='{"key": "value"}'></textarea>

  <div class="controls">
    <button onclick="format(2)">整形する(インデント2)</button>
    <button onclick="format(0)">圧縮する</button>
    <button class="secondary" onclick="copyResult()">コピー</button>
  </div>

  <div id="error"></div>

  <script>
    function format(indent) {
      const input = document.getElementById('input');
      const errorDiv = document.getElementById('error');
      errorDiv.textContent = '';
      try {
        const parsed = JSON.parse(input.value);
        input.value = JSON.stringify(parsed, null, indent || undefined);
      } catch (e) {
        errorDiv.textContent = 'JSONとして解析できませんでした: ' + e.message;
      }
    }

    function copyResult() {
      const input = document.getElementById('input');
      input.select();
      navigator.clipboard.writeText(input.value).catch(() => {
        document.execCommand('copy');
      });
    }
  </script>

  <p class="privacy">※ プライバシー保護のため、入力データはサーバーに送信・保存されません(ブラウザ内で完結)。</p>

  <a class="support" href="#donation-link-pending" target="_blank" rel="noopener">☕ このツールの開発を支援する</a>
</body>
</html>
