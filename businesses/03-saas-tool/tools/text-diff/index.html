<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>テキスト差分比較ツール</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", sans-serif; max-width: 960px; margin: 32px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.5rem; }
  .desc { color: #555; font-size: 0.9rem; margin-bottom: 20px; }
  .inputs { display: flex; gap: 16px; }
  .col { flex: 1; display: flex; flex-direction: column; }
  textarea { width: 100%; height: 220px; font-family: monospace; font-size: 0.9rem; padding: 8px; box-sizing: border-box; }
  label { font-weight: bold; margin-bottom: 4px; }
  button { margin-top: 16px; padding: 10px 20px; font-size: 1rem; cursor: pointer; border: none; border-radius: 6px; background: #2b6cb0; color: white; }
  button:hover { background: #245a94; }
  #result { margin-top: 24px; border: 1px solid #ddd; border-radius: 6px; padding: 12px; font-family: monospace; font-size: 0.9rem; white-space: pre-wrap; line-height: 1.6; }
  .added { background: #d4f7d4; }
  .removed { background: #ffd6d6; text-decoration: line-through; }
  .privacy { margin-top: 12px; font-size: 0.8rem; color: #888; }
  .support { display: inline-block; margin-top: 24px; padding: 8px 16px; border: 1px solid #ddd; border-radius: 6px; color: #555; text-decoration: none; font-size: 0.85rem; }
  .support:hover { background: #f7f7f7; }
</style>
</head>
<body>
  <h1>テキスト差分比較ツール</h1>
  <p class="desc">2つのテキストを行単位で比較し、追加・削除された行をハイライトします。すべてブラウザ内で処理され、外部にデータは送信されません。</p>

  <div class="inputs">
    <div class="col">
      <label for="textA">テキストA(変更前)</label>
      <textarea id="textA" placeholder="ここに元のテキストを貼り付け"></textarea>
    </div>
    <div class="col">
      <label for="textB">テキストB(変更後)</label>
      <textarea id="textB" placeholder="ここに比較したいテキストを貼り付け"></textarea>
    </div>
  </div>

  <button onclick="runDiff()">差分を比較する</button>

  <div id="result"></div>
  <p class="privacy">※ プライバシー保護のため、入力データはサーバーに送信・保存されません(ブラウザ内で完結)。</p>

  <a class="support" href="https://buy.stripe.com/test_6oUeVccm12Kz0RAb185Vu00" target="_blank" rel="noopener">☕ このツールの開発を支援する</a>

  <script>
    // シンプルなLCSベースの行単位差分アルゴリズム
    function diffLines(a, b) {
      const linesA = a.split('\n');
      const linesB = b.split('\n');
      const n = linesA.length, m = linesB.length;
      const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));

      for (let i = n - 1; i >= 0; i--) {
        for (let j = m - 1; j >= 0; j--) {
          if (linesA[i] === linesB[j]) {
            dp[i][j] = dp[i + 1][j + 1] + 1;
          } else {
            dp[i][j] = Math.max(dp[i + 1][j], dp[i][j + 1]);
          }
        }
      }

      const result = [];
      let i = 0, j = 0;
      while (i < n && j < m) {
        if (linesA[i] === linesB[j]) {
          result.push({ type: 'equal', text: linesA[i] });
          i++; j++;
        } else if (dp[i + 1][j] >= dp[i][j + 1]) {
          result.push({ type: 'removed', text: linesA[i] });
          i++;
        } else {
          result.push({ type: 'added', text: linesB[j] });
          j++;
        }
      }
      while (i < n) { result.push({ type: 'removed', text: linesA[i] }); i++; }
      while (j < m) { result.push({ type: 'added', text: linesB[j] }); j++; }
      return result;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function runDiff() {
      const a = document.getElementById('textA').value;
      const b = document.getElementById('textB').value;
      const diff = diffLines(a, b);
      const resultDiv = document.getElementById('result');

      if (a === '' && b === '') {
        resultDiv.textContent = '比較するテキストを入力してください。';
        return;
      }

      resultDiv.innerHTML = diff.map(line => {
        const text = escapeHtml(line.text) || ' ';
        if (line.type === 'added') return `<div class="added">+ ${text}</div>`;
        if (line.type === 'removed') return `<div class="removed">- ${text}</div>`;
        return `<div>&nbsp;&nbsp;${text}</div>`;
      }).join('');
    }
  </script>
</body>
</html>
